<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pacientes | ClinicAgenda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body data-private="true">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="./dashboard.html">ClinicAgenda</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarClinic"
        aria-controls="navbarClinic"
        aria-expanded="false"
        aria-label="Abrir navegación"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarClinic">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="./dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="./patients.html">Pacientes</a></li>
          <li class="nav-item"><a class="nav-link" href="./doctors.html">Médicos</a></li>
          <li class="nav-item"><a class="nav-link" href="./specialties.html">Especialidades</a></li>
          <li class="nav-item"><a class="nav-link" href="./appointments.html">Citas</a></li>
        </ul>

        <div class="d-flex align-items-center gap-2 text-white">
          <span id="currentUserEmail" class="small d-none d-md-inline"></span>
          <button class="btn btn-outline-light btn-sm" id="logoutButton">
            Salir
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <header class="mb-4 d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <h1 class="h3 fw-bold" id="pageTitle">Nuevo paciente</h1>
        <p class="text-muted mb-0">
          Captura la información general del paciente.
        </p>
      </div>

      <a href="./patients.html" class="btn btn-outline-secondary">
        Volver al listado
      </a>
    </header>

    <div id="alertContainer"></div>

    <section class="card app-card">
      <div class="card-body">
        <form id="patientForm" novalidate>
          <input type="hidden" id="patientId" name="patientId">

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="fullName" class="form-label">Nombre completo</label>
              <input
                type="text"
                class="form-control"
                id="fullName"
                name="fullName"
                required
                minlength="3"
                placeholder="Ej. Ana López Martínez"
              >
            </div>

            <div class="col-12 col-md-6">
              <label for="email" class="form-label">Correo electrónico</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                required
                placeholder="paciente@correo.com"
              >
            </div>

            <div class="col-12 col-md-6">
              <label for="phone" class="form-label">Teléfono</label>
              <input
                type="tel"
                class="form-control"
                id="phone"
                name="phone"
                required
                minlength="10"
                placeholder="Ej. 4771234567"
              >
            </div>

            <div class="col-12 col-md-6">
              <label for="birthDate" class="form-label">Fecha de nacimiento</label>
              <input
                type="date"
                class="form-control"
                id="birthDate"
                name="birthDate"
                required
              >
            </div>

            <div class="col-12 col-md-6">
              <label for="gender" class="form-label">Género</label>
              <select class="form-select" id="gender" name="gender" required>
                <option value="">Selecciona una opción</option>
                <option value="female">Femenino</option>
                <option value="male">Masculino</option>
                <option value="other">Otro</option>
                <option value="not_specified">Prefiere no decirlo</option>
              </select>
            </div>

            <div class="col-12">
              <label for="address" class="form-label">Dirección</label>
              <textarea
                class="form-control"
                id="address"
                name="address"
                rows="3"
                required
                minlength="5"
                placeholder="Dirección del paciente"
              ></textarea>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 flex-wrap mt-4">
            <a href="./patients.html" class="btn btn-outline-secondary">
              Cancelar
            </a>

            <button type="submit" class="btn btn-primary" id="savePatientButton">
              Guardar paciente
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./assets/js/main.js"></script>
  <script type="module" src="./assets/js/patient-form.js"></script>
</body>
</html>
