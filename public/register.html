<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro | ClinicAgenda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body class="bg-soft">
  <main class="auth-wrapper">
    <section class="card app-card auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="mb-4 text-center">
          <h1 class="h3 fw-bold text-primary">Crear cuenta</h1>
          <p class="text-muted mb-0">Registro de usuario para ClinicAgenda</p>
        </div>

        <div id="alertContainer"></div>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="fullName" class="form-label">Nombre completo</label>
            <input type="text" class="form-control" id="fullName" name="fullName" required minlength="3">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" required minlength="6">
            <div class="form-text">Mínimo 6 caracteres.</div>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="registerButton">Crear cuenta</button>
        </form>

        <p class="text-center text-muted mt-4 mb-0">
          ¿Ya tienes cuenta? <a href="./login.html">Inicia sesión</a>
        </p>
      </div>
    </section>
  </main>

  <script type="module">
    import { setupRegisterForm, redirectIfAuthenticated } from './assets/js/auth.js';
    redirectIfAuthenticated();
    setupRegisterForm();
  </script>
</body>
</html>
